<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사업분야: 사업실적</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico?v=20261022">
    <link rel="apple-touch-icon" href="./app_icon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/aos.css">
    <link rel="stylesheet" href="./css/swiper.min.css">
    <link rel="stylesheet" href="./css/common.css?v=20261022-account">
    <link rel="stylesheet" href="./css/sub_common.css">
    <link rel="stylesheet" href="./css/sub2/sub2_4.css">
    <script src="https://kit.fontawesome.com/41c9e9a1a8.js" crossorigin="anonymous"></script>
    <script>
        try {
            window.addEventListener('load', function () {
                setTimeout(scrollTo, 0, 0, 1);
            }, false);
        } catch (e) {}
    </script>
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문 바로가기</a>
        <a href="#gnb">메뉴 바로가기</a>
    </div>

    <div id="splash-screen" aria-hidden="true">
        <img src="./images/main/header_logo.png" alt="" class="splash-logo">
    </div>

    <div id="wrap">
        <header id="headerArea">
            <!-- 헤더영역 로드 -->
        </header>

        <div class="visual sub_visual">
            <img src="./images/sub2/sub2_visualX4.jpg" alt="">
            <div class="visual_txt">
                <p class="visual_en">BUSINESS</p>
                <strong>사업분야</strong>
                <p class="visual_ko">기술로 더 나은 공간과 삶을 만듭니다.</p>
            </div>
        </div>

        <div class="sub_nav">
            <ul>
                <li><a href="./sub2_1.html">건축사업</a></li>
                <li><a href="./sub2_2.html">토목사업</a></li>
                <li><a href="./sub2_3.html">주택사업</a></li>
                <li><a class="active" href="./sub2_4.html">사업실적</a></li>
            </ul>
        </div>        
        <main id="content">
            <article>
   
                <div class="title_area">
                    <div class="line_map">
                        HOME &gt; 사업분야 &gt; <strong>사업실적</strong>
                    </div>
                    <h2>
                        <span class="title_main">사업실적<img src="./images/common/kumhoenc_logo_01_03.png" alt=""></span>
                        <span class="title_en">ALL PROJECTS</span>
                    </h2>
                </div>
                <div class="content_area">
                    <section class="project_search">
                        <h3 class="sec_tit">
                            <span class="sec_label">01 PROJECT SEARCH</span>
                            프로젝트를 찾아보세요.
                        </h3>

                        <div class="project_search_box">
                            <label for="title" class="hidden">프로젝트명 검색</label>
                            <input type="text" id="title" placeholder="프로젝트명을 입력해 주세요." autocomplete="off" aria-controls="project-hints" aria-expanded="false">
                            <button id="btn" class="search_btn" type="button">
                                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                                <span class="hidden">검색</span>
                            </button>
                            <ul id="project-hints" class="search_hints" role="listbox" hidden></ul>
                        </div>

                        <div class="filter_chip_box">
                            <button type="button" class="filter_chip active" data-category="all">전체</button>
                            <button type="button" class="filter_chip" data-category="architecture">건축</button>
                            <button type="button" class="filter_chip" data-category="civil">토목</button>
                            <button type="button" class="filter_chip" data-category="housing">주택</button>
                        </div>

                        <div class="filter_control">
                            <div class="filter_region">
                                <label for="region" class="hidden">지역 선택</label>
                                <select id="region" name="region">
                                    <option value="">전체 지역</option>
                                    <option value="seoul">서울특별시</option>
                                    <option value="busan">부산광역시</option>
                                    <option value="incheon">인천광역시</option>
                                    <option value="gyeonggi">경기도</option>
                                    <option value="jeonnam">전라남도</option>
                                </select>
                            </div>
                        </div>
                    </section>

                    <section class="project_results">
                        <p class="sec_label">02 PROJECT LIST</p>
                        <div class="result_title_inner">
                            <h3>전체 프로젝트</h3>
                            <span class="result_count">총 0건</span>
                        </div>

                        <div class="result_sort">
                            <label for="projectSort" class="hidden">프로젝트 정렬</label>
                            <select id="projectSort" name="sort">
                                <option value="latest">최신순</option>
                                <option value="oldest">오래된순</option>
                            </select>
                        </div>

                        <ul class="project_list"></ul>

                        <button type="button" class="project_more">
                            프로젝트 더 보기 <span>＋</span>
                        </button>
                    </section>
                </div>
</article>
        </main>

        <footer id="footerArea">
           <!-- 푸터영역 로드 -->
        </footer>
    </div>

    <script src="./js/jquery-1.12.4.min.js"></script>
    <script src="./js/jquery-migrate-1.4.1.min.js"></script>
    <script src="./js/swiper.min.js"></script>
    <script src="./js/sub2/sub2_4.js"></script>
    <script>
        // 헤더를 불러온 다음 푸터를 불러온다.
        $('#headerArea').load('./common/header.html?v=20261022-account', function () {
            $('#footerArea').load('./common/footer.html?v=20261022-account', function () {
                // 공통 영역이 모두 만들어진 뒤 common.js를 한 번만 실행한다.
                $.getScript('./js/common.js?v=20261022-account', function () {
                    // 공통 영역과 공통 스크립트가 모두 준비된 뒤 AOS 위치를 다시 계산한다.
                    AOS.refreshHard();
                });
            });
        });
    </script>
    <script src="./js/main.js"></script>
    <script src="./js/aos.js"></script>
    <script>
        AOS.init({
            duration: 700,
            easing: 'ease-in-out-sine',
            offset: 120,
            once: false
        });
    </script>
</body>
</html>
